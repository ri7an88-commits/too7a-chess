<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>too7a Chess - FIDE Compliant</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --gold: #d4af37; --white-piece: #f5e6d3; --black-piece: #2c2c2c; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f3a 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f0f0f0;
        }

        .app { width: 100%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
        .header { text-align: center; padding: 30px 20px; border-bottom: 3px solid var(--gold); }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3em;
            background: linear-gradient(180deg, #d4af37 0%, #f0e6d2 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .header p { font-size: 0.95em; color: #c0c0c0; letter-spacing: 2px; }

        .container {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 700px 280px;
            gap: 30px;
            padding: 30px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            background: linear-gradient(135deg, rgba(30, 33, 62, 0.8), rgba(15, 52, 96, 0.6));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-height: 85vh;
            overflow-y: auto;
        }

        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2em;
            color: var(--gold);
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
            font-weight: 700;
        }

        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.9em; border-bottom: 1px solid rgba(212, 175, 55, 0.1); }
        .stat-label { color: #a8a8a8; }
        .stat-value { color: var(--gold); font-weight: 700; }

        select {
            width: 100%;
            padding: 10px;
            background: rgba(15, 52, 96, 0.5);
            border: 2px solid rgba(212, 175, 55, 0.3);
            color: var(--gold);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9em;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.1));
            color: var(--gold);
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover { background: linear-gradient(135deg, rgba(212, 175, 55, 0.4), rgba(212, 175, 55, 0.2)); transform: translateY(-2px); }
        button.danger { border-color: #e74c3c; color: #e74c3c; }
        button.danger:hover { background: linear-gradient(135deg, rgba(231, 76, 60, 0.4), rgba(231, 76, 60, 0.2)); }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 0;
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #3d2817 0%, #2a1810 100%);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            border: 4px solid var(--gold);
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            cursor: pointer;
            user-select: none;
            border-radius: 6px;
            transition: all 0.2s ease;
            position: relative;
        }

        .square.light { background: linear-gradient(135deg, #f5e6d3 0%, #e8d4b8 100%); }
        .square.dark { background: linear-gradient(135deg, #a68875 0%, #8b6f47 100%); }
        .square:hover { filter: brightness(1.2); transform: scale(1.03); }
        .square.selected { background: linear-gradient(135deg, #ffd700, #ffed4e) !important; box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.5); animation: pulse 0.6s ease-in-out infinite; }

        @keyframes pulse { 0%, 100% { transform: scale(1.03); } 50% { transform: scale(1.08); } }

        .square.valid-move::after { content: ''; width: 14px; height: 14px; background: radial-gradient(circle, rgba(15, 52, 96, 0.8), rgba(15, 52, 96, 0.4)); border-radius: 50%; }
        .square.capture::after { content: '●'; font-size: 0.5em; color: #e74c3c; }

        .piece {
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
            transition: all 0.15s ease;
            cursor: grab;
        }

        .piece.white { color: var(--white-piece); text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); }
        .piece.black { color: var(--black-piece); text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3); }
        .piece:hover { filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.6)); transform: scale(1.12) translateY(-3px); }

        .move-history { max-height: 200px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
        .move-tag {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(212, 175, 55, 0.1));
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold);
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
        }

        .status-box {
            padding: 12px;
            background: rgba(212, 175, 55, 0.2);
            border-left: 4px solid var(--gold);
            border-radius: 6px;
            color: var(--gold);
            font-weight: 600;
            margin-top: 15px;
            font-size: 0.85em;
            text-align: center;
        }

        .status-box.check { border-left-color: #e74c3c; background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

        .pieces-row { display: flex; gap: 4px; flex-wrap: wrap; font-size: 1.5em; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(212, 175, 55, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold), #a68857); border-radius: 10px; }

        @media (max-width: 1200px) {
            .container { grid-template-columns: 1fr; gap: 20px; }
            .header h1 { font-size: 2.2em; }
            .chessboard { max-width: 500px; justify-self: center; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>♞ TOO7A CHESS ♞</h1>
            <p>FIDE INTERNATIONAL RULES - COMPLETE CHESS ENGINE</p>
        </div>

        <div class="container">
            <div class="panel">
                <div class="panel-title">⚙️ Controls</div>
                <div class="stat-row">
                    <span class="stat-label">Status</span>
                    <span class="stat-value" id="status">White</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Moves</span>
                    <span class="stat-value" id="moveCount">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Difficulty</span>
                </div>
                <select id="difficulty">
                    <option value="1">Easy (Random)</option>
                    <option value="2" selected>Medium (Smart)</option>
                    <option value="3">Hard (Tactical)</option>
                </select>
                <button id="newGame">🎮 New Game</button>
                <button id="flip">🔄 Flip Board</button>
                <button class="danger" id="reset">🗑️ Reset</button>
                <div class="status-box" id="gameStatus">Ready to play!</div>
            </div>

            <div class="chessboard" id="chessboard"></div>

            <div class="panel">
                <div class="panel-title">📋 Move History</div>
                <div class="move-history" id="moveHistory"></div>
                
                <div class="panel-title" style="margin-top: 20px;">💾 Save Game</div>
                <button id="exportBtn">📥 Export PGN</button>
                <button id="saveBtn">💿 Save</button>
                <button id="loadBtn">📂 Load</button>

                <div class="panel-title" style="margin-top: 20px;">♜ Captured Pieces</div>
                <div style="font-size: 0.85em; color: #a8a8a8; margin-bottom: 8px;">⚪ White Lost</div>
                <div class="pieces-row" id="capturedW"></div>
                <div style="font-size: 0.85em; color: #a8a8a8; margin: 12px 0 8px 0;">⚫ Black Lost</div>
                <div class="pieces-row" id="capturedB"></div>
            </div>
        </div>
    </div>

    <script src="engine.js"></script>
</body>
</html>
